name: VIctory

on:
  push:
    branches: [main]
    paths:
      - "runtimes/victory"
      - "runtimes/victory-patches/**"
      - ".gitmodules"
      - ".github/workflows/victory.yml"
  pull_request:
    paths:
      - "runtimes/victory"
      - "runtimes/victory-patches/**"
      - ".gitmodules"
      - ".github/workflows/victory.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: victory-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: runtimes/victory
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned runtime
        working-directory: .
        run: git submodule update --init --depth 1 -- runtimes/victory
      - name: Apply the reviewed source patches
        run: |
          $base = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($base -ne 'ffe310eb2098e52169f4c44db5ffdabf43a72622') { throw 'Unexpected runtime base' }
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) { throw 'Runtime checkout must be clean before patching' }
          $patches = @(
            '../victory-patches/61474f6-region-copy.patch',
            '../victory-patches/417f4e3-root-view-loads.patch',
            '../victory-patches/amd-world-guards.patch',
            '../victory-patches/watch-fixture-retirement.patch'
          )
          foreach ($patch in $patches) {
            git apply --check --index $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git apply --index $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
      - name: Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo +1.98.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo +1.98.1 test --workspace --locked
