name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Python tools compile
        run: python -m compileall -q make_game.py tools
      - name: make_game.py help
        run: python -I make_game.py --help
      - name: Build rpf9dump
        run: dotnet build tools/rpf9dump/rpf9dump.csproj -c Release
      - name: No game data tracked
        shell: bash
        run: |
          bad=$(git ls-files | grep -iE '\.(rpf|ttpf|xvd|dxbc|fssm|spv|spvasm|dds|bk2|awc|exe|dll)$' || true)
          if [ -n "$bad" ]; then echo "Game or binary files tracked:"; echo "$bad"; exit 1; fi
  translator-tests:
    runs-on: ubuntu-24.04
  semantic-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install llvm-mc and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 spirv-tools
          pip install pytest
      - name: Translator tests
        run: python -m pytest tests -q
      - name: Translator semantic tests
        run: python -m unittest discover -s tests/semantic -v
