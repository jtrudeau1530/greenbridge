# Forgejo copy of .github/workflows/runtime.yml: the Linux job only. The self-hosted Forgejo runner has no
# Windows or macOS machines, so the windows, wine (needs windows) and macos jobs are left out. sccache keeps its
# cache on the runner because Forgejo has no GitHub Actions cache v2 service for its gha backend.
name: Runtime

on:
  # What can break this build: the runtime and its vendored queue, the scripts the jobs run, this workflow, the
  # line endings every checkout gets (.gitattributes), and everything the tools those scripts read depend on -
  # their sibling imports, the data files they load by name (gfx10_formats.json is one a .py-only scan misses) and
  # the hw_oracle directory. Any other file under tools/ used to start a full Windows and Wine build it cannot break
  # (BUILD-856); paths-ignore cannot say "everything under tools/ except these", so the event lists what triggers
  # it. tests/test_runtime_paths.py recomputes the tools/ part and fails when an entry is missing; keep the two
  # lists identical.
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "third_party/**"
      - "scripts/**"
      - ".github/workflows/runtime.yml"
      - ".forgejo/workflows/runtime.yml"
      - ".gitattributes"
      - "tools/hw_oracle/**"
      - "tools/bary_fallback_gs.py"
      - "tools/cf_diff.py"
      - "tools/cf_ref.py"
      - "tools/cfg_structure.py"
      - "tools/cpu_ref.py"
      - "tools/f32_fuzz.py"
      - "tools/first_light.py"
      - "tools/fspx_unpack.py"
      - "tools/fssm_header.py"
      - "tools/fssm_unpack.py"
      - "tools/gen_d3d12_stubs.py"
      - "tools/gfx10_formats.json"
      - "tools/lane_masks.py"
      - "tools/mc_command.py"
      - "tools/mesh_compute_vs.py"
      - "tools/rdna2spirv.py"
      - "tools/report_paths.py"
      - "tools/shader_carve.py"
      - "tools/shader_disasm.py"
      - "tools/shader_ir.py"
      - "tools/shader_meta.py"
      - "tools/shader_stage_manifest.py"
      - "tools/spirv_asm.py"
      - "tools/spirv_asm_tables.py"
      - "tools/spirv_opt.py"
      - "tools/spirv_stubs.py"
      - "tools/vk_subgroup_info.py"
      - "tools/wave64_emulate_opt.py"
      - "tools/wave64_halves.py"
      - "tools/xdxr_bvh.py"
  pull_request:
    paths:
      - "runtime/**"
      - "third_party/**"
      - "scripts/**"
      - ".github/workflows/runtime.yml"
      - ".forgejo/workflows/runtime.yml"
      - ".gitattributes"
      - "tools/hw_oracle/**"
      - "tools/bary_fallback_gs.py"
      - "tools/cf_diff.py"
      - "tools/cf_ref.py"
      - "tools/cfg_structure.py"
      - "tools/cpu_ref.py"
      - "tools/f32_fuzz.py"
      - "tools/first_light.py"
      - "tools/fspx_unpack.py"
      - "tools/fssm_header.py"
      - "tools/fssm_unpack.py"
      - "tools/gen_d3d12_stubs.py"
      - "tools/gfx10_formats.json"
      - "tools/lane_masks.py"
      - "tools/mc_command.py"
      - "tools/mesh_compute_vs.py"
      - "tools/rdna2spirv.py"
      - "tools/report_paths.py"
      - "tools/shader_carve.py"
      - "tools/shader_disasm.py"
      - "tools/shader_ir.py"
      - "tools/shader_meta.py"
      - "tools/shader_stage_manifest.py"
      - "tools/spirv_asm.py"
      - "tools/spirv_asm_tables.py"
      - "tools/spirv_opt.py"
      - "tools/spirv_stubs.py"
      - "tools/vk_subgroup_info.py"
      - "tools/wave64_emulate_opt.py"
      - "tools/wave64_halves.py"
      - "tools/xdxr_bvh.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Coalesce superseded pending pushes per branch without canceling an active main build.
  group: runtime-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Also runs the hand-written GPU tests (runtime/test/shaders) on Mesa's llvmpipe, a software Vulkan driver, so a
  # translator or harness change that breaks a test result shows up on every pull request, without a GPU.
  linux-gpu-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sccache-action's post step needs a github.com token Forgejo cannot supply; install the release binary.
      - name: Install sccache
        run: |
          v=v0.10.0; n=sccache-$v-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/$v/$n.tar.gz" | sudo tar -xz -C /usr/local/bin --strip-components=1 "$n/sccache"
          sccache --version
      - name: Cache Vulkan headers
        id: vulkan-headers-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vulkan-headers/include
          key: vulkan-headers-6802bb4733b63ed5efd3adb308a6c885ef180ea1
      - name: Checkout Vulkan headers (vulkan-sdk-1.4.363.0)
        if: steps.vulkan-headers-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/Vulkan-Headers
          github-server-url: https://github.com
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1 # vulkan-sdk-1.4.363.0
          path: .vulkan-headers
          sparse-checkout: include
          persist-credentials: false
      - name: Install llvmpipe, llvm-mc and SPIRV-Tools
        run: |
          pkgs=(libvulkan-dev mesa-vulkan-drivers vulkan-tools spirv-tools)
          command -v cmake >/dev/null || pkgs+=(cmake)
          command -v ninja >/dev/null || pkgs+=(ninja-build)
          command -v g++ >/dev/null || pkgs+=(g++)
          [ -x /usr/lib/llvm-19/bin/llvm-mc ] || pkgs+=(llvm-19)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
      - name: Sanity check llvm-mc amdgcn target
        run: /usr/lib/llvm-19/bin/llvm-mc --version | grep -q 'amdgcn'
      - name: Configure
        env:
          VULKAN_SDK: ${{ github.workspace }}/.vulkan-headers
        run: >-
          cmake -S runtime -B runtime/build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DLEONIDA_REQUIRE_VULKAN=ON
      - name: Build
        run: cmake --build runtime/build --parallel
      - name: Check GPU tools exist
        run: |
          for tool in vk_harness vk_pipeline_check vk_command_replay_test vk_queue_test vk_predicate_capture_test vk_predicated_copy_test vk_compute_test vk_texture_test vk_store_test vk_bindless_test depth24_convert_test clear_color_test predicated_copy_test d3d12_state_map_test command_list_test descriptor_table_test gfx10_descriptors_test; do
            if [ ! -f "runtime/build/$tool" ] && [ ! -f "runtime/build/$tool.exe" ]; then
              echo "Missing: $tool"
              exit 1
            fi
          done
          echo "All GPU tools built"
      - name: CPU runtime tests (Linux)
        run: ctest --test-dir runtime/build --output-on-failure
      - name: Predicate and byte-copy shader validation and lifetimes
        run: |
          python3 -c 'import re,struct; from pathlib import Path; s=Path("runtime/src/predicate_reduce_spv.h").read_text(); w=[int(x,16) for x in re.findall(r"0x([0-9a-f]{8})u",s)]; Path("runtime/build/predicate_reduce.spv").write_bytes(struct.pack("<%dI"%len(w),*w))'
          spirv-val --target-env vulkan1.1 runtime/build/predicate_reduce.spv
          runtime/build/vk_predicate_capture_test
          python3 -c 'import re,struct; from pathlib import Path; s=Path("runtime/src/predicated_copy_spv.h").read_text(); w=[int(x,16) for x in re.findall(r"0x([0-9a-f]{8})u",s)]; Path("runtime/build/predicated_copy.spv").write_bytes(struct.pack("<%dI"%len(w),*w))'
          spirv-val --target-env vulkan1.2 runtime/build/predicated_copy.spv
          runtime/build/vk_predicated_copy_test
      - name: GPU tests on llvmpipe
        run: |
          vulkaninfo --summary | grep -E 'deviceName.*llvmpipe'  # fails the step if llvmpipe isn't there
          python3 -I scripts/run_gpu_tests.py --build runtime/build --llvm-mc /usr/lib/llvm-19/bin/llvm-mc --work "$RUNNER_TEMP/gpu-native"
      - name: Pipeline checker exit status on llvmpipe
        shell: bash
        run: |
          dir=$(mktemp -d "$RUNNER_TEMP/pipeline-check.XXXXXX")
          echo '{"ready":{"stage":"vs"},"missing":{"stage":"ps","outputs":[0]}}' > "$dir/index.json"
          python3 -I tools/spirv_stubs.py "$dir"
          cp "$dir/stubs/vs_empty.spv" "$dir/ready.spv"
          check() {
            runtime/build/vk_pipeline_check "$dir" "$dir/cache.bin" "$@" | tee "$dir/check.log"
          }

          status=0
          check || status=$?
          test "$status" -eq 1
          grep -Fx 'MODULE FAIL missing' "$dir/check.log"
          grep -Fx 'vs pipelines: 1 ok, 0 failed, 0 skipped' "$dir/check.log"
          test -s "$dir/cache.bin"

          cp "$dir/stubs/ps_empty.spv" "$dir/missing.spv"
          check
          grep -Fx 'ps pipelines: 1 ok, 0 failed, 0 skipped' "$dir/check.log"
          grep -Fx 'vs pipelines: 1 ok, 0 failed, 0 skipped' "$dir/check.log"
          if grep -F 'cache feedback' "$dir/check.log"; then exit 1; fi  # opt-in: nothing without the flag

          check --max-bytes 1
          grep -F 'big modules skipped: 2' "$dir/check.log"

          # --cache-feedback: hits + no hit reported + unavailable == ok per stage; no particular bit is required
          check --cache-feedback
          for st in ps vs; do
            awk -v st="$st" '$1 == st && $2 == "pipelines:" { ok = $3 }
              $1 == st && $2 == "cache" && $3 == "feedback:" { sum = $4 + $6 + $10; seen = 1 }
              END { exit !(seen && ok == 1 && sum == ok) }' "$dir/check.log"
          done
      - name: GPU tests on llvmpipe, compute with wave64 emulation
        # llvmpipe has 8-wide subgroups, so the wave64 compute tests only run emulated. The emulated mesh tests are
        # left out: llvmpipe's LLVM backend aborts compiling them ("Cannot emit physreg copy instruction").
        env:
          LEONIDA_W64_EMULATE: "1"
        run: python3 -I scripts/run_gpu_tests.py --build runtime/build --llvm-mc /usr/lib/llvm-19/bin/llvm-mc --work "$RUNNER_TEMP/gpu-w64" --filter cs_
      - name: GPU tests on llvmpipe with the barycentric fallback
        # llvmpipe has no VK_KHR_fragment_shader_barycentric, so the native run skips the pixel shaders that read raw
        # barycentrics. Under --bary-fallback they read them from an input a pass-through geometry shader feeds
        # (tools/bary_fallback_gs.py), the path for GPUs without the extension (NVIDIA Pascal). Every shader that
        # got such a geometry shader has to pass here, not skip.
        shell: bash
        env:
          LEONIDA_BARY_FALLBACK: "1"
        run: |
          log="$RUNNER_TEMP/gpu-bary.log"
          python3 -I scripts/run_gpu_tests.py --build runtime/build --llvm-mc /usr/lib/llvm-19/bin/llvm-mc --work "$RUNNER_TEMP/gpu-bary" | tee "$log"
          names=$(sed -n 's/^bary fallback GS: \(.*\)\.bary_gs\.spv$/\1/p' "$log")
          if [ -z "$names" ]; then
            echo "::error::no barycentric fallback geometry shader was built"
            exit 1
          fi
          while read -r name; do
            if ! grep -Eq "^  PASS  ${name}( |\$)" "$log"; then
              echo "::error::$name did not pass under the barycentric fallback"
              exit 1
            fi
          done <<< "$names"

  # Builds the runtime on an Apple Silicon Mac and runs its tests and the hand-written GPU tests on MoltenVK. The
  # hosted runner is a VM whose Metal device is "Apple Paravirtual device" (MTLGPUFamilyMac2, not Apple7), so
  # Mesa's KosmicKrisp finds no device there; MoltenVK runs, with 32-wide subgroups. macos-26, not macos-15: Xcode
